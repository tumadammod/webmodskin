<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04060e">
<title>Không tìm thấy trang</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cy:#33e6ff; --vi:#9b5cff; --mg:#ff3d9a; --lm:#46ffa8; --am:#ffcf4a; --rd:#ff4f6b;
  --bg:#04060e; --bg2:#070b18; --tx:#dce6ff; --tx-hi:#f2f7ff; --tx-dim:#6f7fa8;
  --line:rgba(51,230,255,.18); --panel:rgba(14,22,44,.6);
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg);color:var(--tx);overflow-x:hidden;
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(800px 560px at 82% -8%, rgba(255,79,107,.13), transparent 62%),
    radial-gradient(700px 520px at -8% 30%, rgba(155,92,255,.14), transparent 62%),
    linear-gradient(180deg,var(--bg),var(--bg2))}
#grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(51,230,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,230,255,.07) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%)}
.card{position:relative;max-width:400px;width:100%;padding:34px 26px;border-radius:18px;
  text-align:center;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.5)}
.card::before,.card::after{content:'';position:absolute;width:14px;height:14px;pointer-events:none;
  border:2px solid var(--rd);opacity:.55}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 18px 0}
.ic{display:inline-flex;width:52px;height:52px;color:var(--rd);
  filter:drop-shadow(0 0 16px rgba(255,79,107,.5));margin-bottom:16px}
.ic svg{width:100%;height:100%}
h2{margin:0 0 10px;font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tx-hi)}
p{margin:0;font-size:12.5px;color:var(--tx-dim);line-height:1.7}
.hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--tx-dim)}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<div class="card">
  <span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 21.5 20h-19L12 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1" fill="currentColor"/></svg></span>
  <h2>Trang mật khẩu không tồn tại</h2>
  <p>Link này đã hết hạn từ lâu và đã bị dọn dẹp,<br>
  hoặc địa chỉ không đúng.</p>
  <div class="hint">Quay lại Telegram, bấm <b>RUN</b> lại trong bot để nhận link mật khẩu mới.</div>
</div>
</body></html>
