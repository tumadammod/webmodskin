<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mật khẩu nhận file</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0f1c;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e8ecff}
  .card{max-width:420px;width:90%;padding:32px 26px;border-radius:18px;text-align:center;
    background:linear-gradient(160deg,#0d1220,#131a2e);border:1px solid rgba(80,140,255,.25);
    box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .lb{font-size:12px;font-weight:800;letter-spacing:.14em;color:#6ea8ff;text-transform:uppercase}
  .code{font-size:44px;font-weight:900;letter-spacing:.1em;margin:16px 0;
    font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(110,168,255,.55)}
  button{border:0;cursor:pointer;padding:11px 22px;border-radius:12px;font-weight:800;
    font-size:13px;background:linear-gradient(120deg,#6ea8ff,#8f6bff);color:#0a0f1e}
  .hint{margin-top:16px;font-size:11.5px;color:#8492b8;line-height:1.6}
  .expired{display:none;color:#ff8080;font-weight:700;margin-top:10px}
</style></head>
<body>
<div class="card">
  <div class="lb">🔑 Mật khẩu nhận file</div>
  <div class="code" id="code">808 536</div>
  <button onclick="cp()">📋 Copy mật khẩu</button>
  <div class="hint">Dán mật khẩu vào khung chat với bot để nhận file.<br>
    Còn hiệu lực tới <b id="until"></b></div>
  <div class="expired" id="expired">⚠️ Mã đã hết hạn — đang chuyển tới trang mới…</div>
</div>

<script>
  var UNTIL = 1785963950 * 1000;
  document.getElementById('until').textContent = new Date(UNTIL).toLocaleTimeString('vi-VN');
  function cp(){
    navigator.clipboard.writeText("808536").catch(function(){});
  }
  function checkExpiry(){
    if (Date.now() > UNTIL) {
      document.getElementById('expired').style.display = 'block';
      fetch("https://webmodskin.vercel.app/pass/latest.json?t=" + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.url) location.replace(d.url); })
        .catch(function(){});
    }
  }
  setInterval(checkExpiry, 5000);
</script>
</body></html>
