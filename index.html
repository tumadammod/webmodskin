<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#07080d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>TUMADAM — Mod Skin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<link rel="stylesheet" href="extra.css?v=2">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ═══ NỀN ═══ -->
<div id="aurora">
  <span class="blob b1"></span><span class="blob b2"></span>
  <span class="blob b3"></span><span class="blob b4"></span>
</div>
<div id="noise"></div>

<!-- ═══ THẺ NGƯỜI DÙNG ═══ -->
<header class="topbar">
  <div class="user-card" id="userCard">
    <div class="ava-ring" id="avaRing">
      <div class="avatar" id="avatar"></div>
      <span class="ava-status" id="avaStatus"></span>
    </div>

    <div class="user-meta">
      <div class="user-name" id="userName">Đang kết nối…</div>
      <div class="user-tags" id="userTags"></div>
    </div>

    <div class="mode-pill">
      <span class="mp-ico" data-ic="shield"></span>
      <span class="mp-tx">Normal<em>Encode</em></span>
    </div>
  </div>

  <div class="stats-strip" id="statsStrip">
    <div class="stat-chip"><span class="sv" id="stHeroes">—</span><span class="sl">Tướng</span></div>
    <div class="stat-chip"><span class="sv" id="stSkins">—</span><span class="sl">Skin</span></div>
    <div class="stat-chip accent"><span class="sv" id="stCart">0</span><span class="sl">Đã chọn</span></div>
  </div>
</header>

<!-- ═══ TAB ═══ -->
<nav class="tabs" id="tabsBar">
  <button class="tab active" data-tab="heroes"><span class="tab-ico" data-ic="hero"></span><label>Tướng</label></button>
  <button class="tab" data-tab="cart"><span class="tab-ico" data-ic="cart"></span><label>Giỏ <em id="cartBadge" data-zero></em></label></button>
  <button class="tab" data-tab="more"><span class="tab-ico" data-ic="gear"></span><label>Khác</label></button>
</nav>

<main>

<!-- ═══ TƯỚNG ═══ -->
<section class="page active" id="page-heroes">

  <div class="alpha-pane" id="alphaPane">
    <div class="page-head">
      <div><h2>Chọn Tướng</h2><p>Lọc theo chữ cái hoặc tìm nhanh</p></div>
    </div>

    <div class="search-box">
      <span class="sb-icon" data-ic="search"></span>
      <input id="heroSearch" type="search" placeholder="Tìm tướng hoặc skin…" autocomplete="off" enterkeyhint="search" />
      <button class="clr" id="heroSearchClr" type="button" aria-label="Xoá" hidden>×</button>
    </div>

    <div class="skel-grid" id="alphaSkel" aria-hidden="true">
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
      <div class="skel-cell"></div><div class="skel-cell"></div><div class="skel-cell"></div>
    </div>
    <div class="alpha-grid" id="alphaGrid"></div>
    <div class="search-results" id="heroSearchResults" hidden></div>
  </div>

  <div class="hero-list-pane" id="heroListPane" hidden>
    <button class="back-btn" id="heroBack"><span data-ic="back"></span> Đổi chữ cái</button>
    <div class="page-head"><div><h2 id="heroListTitle"></h2><p id="heroListSub"></p></div></div>
    <div class="hero-grid" id="heroGrid"></div>
  </div>

  <div class="skin-list-pane" id="skinListPane" hidden>
    <button class="back-btn" id="skinBack"><span data-ic="back"></span> Đổi tướng</button>
    <div class="hero-banner" id="heroBanner"></div>
    <div class="skin-grid icon-mode" id="skinGrid"></div>
  </div>
</section>

<!-- ═══ GIỎ ═══ -->
<section class="page" id="page-cart">
  <div class="page-head"><div><h2>Skin Đã Chọn</h2><p id="cartSub">Mỗi tướng chọn 1 skin</p></div></div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-actions" id="cartActions" hidden>
    <button class="btn-primary" id="btnRun"><span data-ic="run"></span> CHẠY MOD — TẠO FILE</button>
    <button class="btn-danger" id="btnClear"><span data-ic="trash"></span> Xoá tất cả</button>
  </div>
</section>

<!-- ═══ KHÁC ═══ -->
<section class="page" id="page-more">
  <div class="page-head"><div><h2>Khác</h2><p>Thông tin &amp; tuỳ chọn</p></div></div>
  <div class="settings-list">
    <div class="set-card static">
      <span class="set-ic c-iris" data-ic="gear"></span>
      <div class="extra-body"><h4>Chế độ mod</h4><p>Normal · Encode — cố định</p></div>
    </div>
    <div class="set-card" id="cardHaptic">
      <span class="set-ic c-rose" data-ic="wave"></span>
      <div class="extra-body"><h4>Rung phản hồi</h4><p>Haptic khi chạm</p></div>
      <span class="toggle" id="hapticToggle"></span>
    </div>
    <div class="set-card static">
      <span class="set-ic c-mint" data-ic="db"></span>
      <div class="extra-body"><h4>Phiên bản dữ liệu</h4><p id="infoVer">—</p></div>
    </div>
    <div class="set-card static">
      <span class="set-ic c-amber" data-ic="user"></span>
      <div class="extra-body"><h4>Tài khoản</h4><p id="infoAcc">—</p></div>
    </div>
  </div>
</section>

</main>

<div class="toast-stack" id="toastStack"></div>

<script src="app.js?v=2"></script>
</body>
</html>
